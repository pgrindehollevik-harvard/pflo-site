name: Supabase keepalive

# Keeps the free-tier project from being paused for inactivity.
# Supabase wants "a few user requests to the database each day" — the daily
# reminders run alone (1 request/day) triggered a pause warning, so this
# adds a few more real database queries spread across the day.

on:
  schedule:
    # 4x daily, offset from the top of the hour to avoid GitHub's cron congestion.
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          # The publishable key is public (it ships in us.html); RLS may return
          # zero rows, but PostgREST still runs a real query against Postgres,
          # which is what counts as activity. -f fails the job on non-2xx so a
          # broken keepalive shows up as a red run instead of silently doing nothing.
          KEY='sb_publishable_HnWbY1qtRubl6n9XxPIC5g_CfthkNtw'
          BASE='https://hqkbqztcsxaafmshbyrb.supabase.co'
          curl -sf -o /dev/null "$BASE/rest/v1/events?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          curl -sf -o /dev/null "$BASE/rest/v1/notes?select=author&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo "Supabase pinged OK"

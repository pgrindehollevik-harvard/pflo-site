<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ffffff" />
  <!-- add to home screen -->
  <link rel="manifest" href="/us.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="oss" />
  <title>oss</title>
  <style>
    :root {
      --bg:#fff; --text:#111; --muted:#666;
      --accent:#AD7C03; --rule:#222; --link:#1a2d5f; --visited:#1a2d5f;
      --soft:#e6e0d2; --softbg:#faf7f0; --heart:#c0392b;
      --pblue:#e3eef7; --pblue-line:#c5dbe9; --pgreen:#e4f1e8; --pgreen-line:#c6ded0; --calmgreen:#3e7d5a;
      --maxw:620px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font:13px/1.45 Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust:100%;}
    a{color:var(--link);text-decoration:underline}
    a:visited{color:var(--visited)}
    a:hover{color:#000;text-decoration:none}
    .wrap{max-width:var(--maxw);margin:40px auto;padding:0 16px}
    .label{color:var(--accent);font-weight:700;font-size:16.8px;display:block;margin:6px 0}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    button{font:inherit;cursor:pointer}
    input{font:inherit}

    /* top bar */
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
      border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:14px}
    .brand .brand-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
    .stat-head{font-size:12px;color:var(--text)}
    .stat-head .big{color:var(--accent);font-weight:700}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .topbar .who{color:var(--muted);font-size:12px;white-space:nowrap;flex:0 0 auto}
    .topbar .who b{color:var(--text);font-weight:700}
    .linkbtn{background:none;border:none;color:var(--link);
      text-decoration:underline;padding:0;font-size:12px}
    .linkbtn:hover{color:#000;text-decoration:none}

    /* status strip: clocks + distance */
    .status{display:flex;justify-content:space-between;align-items:center;gap:10px;
      flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
    .clocks{display:flex;align-items:center;gap:8px}
    .clocks .c b{color:var(--text);font-variant-numeric:tabular-nums}
    .clocks .sep{opacity:.5}
    .callwin{font-size:11px}
    .callwin.good{color:var(--calmgreen);font-weight:700}
    .dist{display:flex;align-items:center;gap:6px;font-size:11px}
    .dist .city{color:var(--text)}
    .dist .line{display:inline-block;width:46px;border-top:1px dashed #bbb;position:relative;height:1px}
    .dist .plane{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:11px}
    .dist.together{color:var(--heart);font-weight:700}

    /* love note */
    .note{border:1px solid var(--pgreen-line);background:var(--pgreen);padding:10px 12px;margin-bottom:16px;font-size:12px}
    .note .from{color:var(--text)}
    .note .from b{color:var(--accent)}
    .note .empty{color:var(--muted);font-style:italic}
    .note .mine{display:flex;gap:6px;margin-top:8px}
    .note .mine input{flex:1 1 auto;padding:6px 8px;border:1px solid var(--soft);background:#fff}
    .note .mine input:focus{outline:none;border-color:var(--accent)}
    .note .mine button{padding:6px 12px;border:1px solid var(--rule);background:var(--text);color:#fff}
    .note .mine button:hover{background:#000}
    .note .saved{color:var(--accent);font-size:11px;margin-top:4px;min-height:13px}

    /* countdown hero */
    .hero{position:relative;overflow:hidden;border:1px solid var(--rule);background:var(--pblue);
      padding:18px 16px;text-align:center;margin-bottom:20px}
    .hero .cap{color:var(--accent);font-weight:700;font-size:13px;
      letter-spacing:.04em;text-transform:lowercase}
    .clock{display:flex;justify-content:center;gap:14px;margin:12px 0 8px}
    .clock .unit{min-width:48px}
    .clock .num{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
    .clock .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
    .hero .ev{font-size:13px;margin-top:2px}
    .hero .ev b{font-weight:700}
    .hero.empty .clock{display:none}
    .hero .together{font-size:20px;font-weight:700;margin:6px 0 4px;color:var(--heart)}

    /* floating hearts */
    .heart-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .heart-fx span{position:absolute;bottom:-20px;font-size:16px;opacity:0;animation:floatUp linear forwards}
    @keyframes floatUp{
      0%{transform:translateY(0) scale(.7);opacity:0}
      15%{opacity:.9}
      100%{transform:translateY(-220px) scale(1.1);opacity:0}
    }

    /* flight tracker (expands under an event row) */
    .fl-detail{padding:8px 0 12px;border-bottom:1px solid #eee}
    .photo-btn.on-air{color:var(--accent)}
    .flight{border:1px solid var(--soft);background:#fff;padding:12px;margin-bottom:10px}
    .fl-detail .flight:last-child{margin-bottom:0}
    .flight .fl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
    .flight .fl-who{font-size:13px;font-weight:700}
    .flight .fl-no{font-size:11px;color:var(--muted)}
    .flight .fl-bar{position:relative;margin:16px 0 4px;height:1px;border-top:1px dashed #bbb}
    .flight .fl-bar .fl-plane{position:absolute;top:-9px;font-size:12px;transform:translateX(-50%)}
    .flight .fl-codes{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
    .flight .fl-codes b{color:var(--text)}
    .flight .fl-times{font-size:11px;color:var(--muted);margin-top:6px}
    .flight .fl-status{font-size:12px;margin-top:6px}
    .flight.inair{border-color:var(--pblue-line);background:var(--pblue)}
    .flight.inair .fl-status{color:var(--accent);font-weight:700}
    .flight.landed{opacity:.55}

    /* memories slideshow */
    .memories{position:relative;margin-bottom:20px;display:none}
    .memories .frame{position:relative;width:100%;height:min(64vh,440px);background:var(--pgreen);overflow:hidden;border:1px solid var(--pgreen-line)}
    .memories .frame .mem-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;pointer-events:none}
    .memories .frame .mem-slide.on{opacity:1;pointer-events:auto}
    .memories .frame .mem-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(22px) brightness(.9);transform:scale(1.15)}
    .memories .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
    .memories .cap{font-size:11px;color:var(--muted);text-align:center;margin-top:5px}
    .memories .mem-add{font-size:12px;text-align:center;margin-top:6px}
    .memories .mem-add a{color:var(--link)}
    .memories .frame .mem-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(255,255,255,.7);border:none;font-size:20px;line-height:1;padding:10px 8px;cursor:pointer;color:var(--text)}
    .memories .frame .mem-arrow:hover{background:rgba(255,255,255,.9)}
    .memories .frame .mem-prev{left:0}
    .memories .frame .mem-next{right:0}

    /* album grid */
    .album{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:2px;margin-top:10px}
    .album img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer;background:var(--pgreen)}

    /* event thumbnail + photo button */
    .ev-row .thumb{flex:0 0 auto;width:34px;height:34px;object-fit:cover;border:1px solid var(--soft);cursor:pointer;align-self:center}
    .photo-btn{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:13px;line-height:1;padding:2px 4px;align-self:center}
    .photo-btn:hover{color:var(--accent)}
    .photo-btn:disabled{opacity:.5;cursor:default}

    /* lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
    .lightbox.on{display:flex}
    .lightbox img{max-width:100%;max-height:100%;object-fit:contain}
    .lightbox .lb-remove{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border:none;padding:6px 14px;font-size:12px;color:#9a2a2a;cursor:pointer;display:none}
    .lightbox .lb-arrow{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.8);font-size:38px;line-height:1;padding:16px 12px;cursor:pointer;display:none}
    .lightbox .lb-arrow:hover{color:#fff}
    .lightbox .lb-prev{left:4px}
    .lightbox .lb-next{right:4px}
    .lightbox .lb-cap{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:12px;max-width:80%;text-align:center}

    /* add form */
    .add{border:1px solid var(--soft);background:#fff;padding:14px;margin-bottom:22px}
    .add .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .add .fieldlbl{font-size:11px;color:var(--muted);margin:2px 0 -2px}
    .add input[type=text]{flex:1 1 100%;padding:8px 9px;border:1px solid var(--soft)}
    .add input[type=date],.add input[type=time]{flex:1 1 0;min-width:120px;padding:8px 9px;border:1px solid var(--soft)}
    .add input:focus{outline:none;border-color:var(--accent)}
    .add input:disabled{background:#f3f1ec;color:#aaa}
    .add .opts{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:4px}
    .add label.chk{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer;user-select:none}
    .add .submit{margin-left:auto;padding:8px 18px;border:1px solid var(--rule);background:var(--text);color:#fff}
    .add .submit:hover{background:#000}
    .add .submit:disabled{opacity:.5;cursor:default}
    .add .err{color:#9a2a2a;font-size:12px;min-height:0;margin-top:6px}

    /* event list */
    .grouphd{color:var(--accent);font-weight:700;font-size:13px;margin:18px 0 6px;
      text-transform:lowercase;letter-spacing:.03em}
    .grouphd-btn{display:block;background:none;border:none;padding:0;text-align:left;width:100%}
    .showmore{display:block;margin-top:6px}
    .ev-list{list-style:none;margin:0;padding:0}
    .ev-row{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid #eee}
    .ev-row .date{flex:0 0 84px;color:var(--accent);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
    .ev-row .body{flex:1 1 auto;min-width:0}
    .ev-row .title{font-size:13px}
    .ev-row .meta{font-size:11px;color:var(--muted);margin-top:1px}
    .ev-row.past{opacity:.55}
    .ev-row.now .date{color:var(--heart)}
    .ev-row .del{flex:0 0 auto;background:none;border:none;color:var(--muted);
      font-size:15px;line-height:1;padding:2px 4px}
    .ev-row .del:hover{color:#9a2a2a}
    .nowtag{color:var(--heart);font-weight:700;font-size:11px}
    .empty-note{color:var(--muted);font-size:12px;padding:10px 0}

    /* footer: days together + actions */
    .footer{margin-top:24px;border-top:1px solid #eee;padding-top:12px;font-size:12px}
    .stats{color:var(--text)}
    .stats .big{color:var(--accent);font-weight:700}
    .stats .sub{color:var(--muted);font-size:11px;margin-top:2px}
    .footer .acts{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}

    .hidden{display:none !important}

    @media (max-width:520px){
      .wrap{margin:22px auto}
      .clock .num{font-size:26px}
      .clock{gap:10px}
      .ev-row .date{flex-basis:74px}
      .add .submit{margin-left:0}
      .status{font-size:11px}
    }
  </style>
</head>
<body>
  <main class="wrap">

    <!-- ===== LOGIN ===== -->
    <section id="login" class="login" style="max-width:300px;margin:18vh auto 0;text-align:center">
      <div style="font-size:22px">&#10084;&#65039;</div>
      <span class="label" style="margin-top:6px;">oss</span>
      <p class="muted small">our private calendar</p>
      <form id="login-form" autocomplete="off" style="margin-top:18px;display:flex;flex-direction:column;gap:10px">
        <input id="pw" type="password" placeholder="password" autocomplete="current-password"
          style="padding:9px 10px;border:1px solid var(--rule);text-align:center" />
        <button class="go" type="submit" id="login-btn"
          style="padding:9px 10px;border:1px solid var(--rule);background:var(--text);color:#fff">enter</button>
        <div id="login-err" style="color:#9a2a2a;font-size:12px;min-height:14px"></div>
      </form>
    </section>

    <!-- ===== APP ===== -->
    <section id="app" class="hidden">
      <div class="topbar">
        <div class="brand">
          <div class="brand-top">
            <span class="label" style="margin:0;">oss</span>
            <span class="stat-head" id="stats-head"></span>
          </div>
        </div>
        <span class="who">hi <b id="who-name"></b> &middot; <button id="signout" class="linkbtn">sign out</button></span>
      </div>

      <!-- clocks + distance -->
      <div class="status" id="status">
        <div class="clocks" id="clocks"></div>
        <div class="dist" id="dist"></div>
      </div>
      <div class="callwin" id="callwin" style="margin-top:-8px;margin-bottom:14px"></div>

      <!-- countdown hero -->
      <div id="hero" class="hero empty">
        <div class="heart-fx" id="heart-fx"></div>
        <div class="cap" id="hero-cap">until we are together again</div>
        <div class="clock" id="clock">
          <div class="unit"><div class="num" id="c-days">0</div><div class="lbl">days</div></div>
          <div class="unit"><div class="num" id="c-hrs">0</div><div class="lbl">hours</div></div>
          <div class="unit"><div class="num" id="c-min">0</div><div class="lbl">min</div></div>
        </div>
        <div class="ev" id="hero-ev"></div>
      </div>

      <!-- rotating memories -->
      <div class="memories" id="memories">
        <div class="frame" id="mem-frame"></div>
        <div class="cap" id="mem-cap"></div>
        <div class="mem-add"><a href="#" id="add-photos-link">+ add photos</a> &middot; <a href="#" id="album-toggle">browse album</a></div>
        <div class="album hidden" id="album"></div>
      </div>

      <!-- add event (collapsed behind the link) -->
      <button id="add-toggle" class="linkbtn" type="button" style="display:block;margin-bottom:22px">+ add event</button>
      <form id="add" class="add hidden" autocomplete="off">
        <div class="row">
          <input id="ev-title" type="text" placeholder="what is happening? (e.g. Molly flies to Boston)" maxlength="120" required />
        </div>
        <div class="fieldlbl">starts</div>
        <div class="row">
          <input id="ev-date" type="date" required />
          <input id="ev-time" type="time" />
        </div>
        <div class="fieldlbl" id="ends-lbl">ends (optional)</div>
        <div class="row" id="ends-row">
          <input id="ev-end-date" type="date" />
          <input id="ev-end-time" type="time" />
        </div>
        <div class="opts">
          <label class="chk"><input id="ev-reunion" type="checkbox" /> &#10084;&#65039; we are together</label>
          <label class="chk"><input id="ev-yearly" type="checkbox" /> &#127874; repeats every year</label>
          <button class="submit" type="submit" id="add-btn">add</button>
        </div>
        <div id="add-err" class="err"></div>
      </form>

      <!-- lists -->
      <div id="lists">
        <div class="grouphd">coming up</div>
        <ul id="upcoming" class="ev-list"></ul>
        <div id="up-empty" class="empty-note hidden">Nothing on the calendar yet. Add the next time you will see each other.</div>

        <div id="bday-wrap" class="hidden">
          <div class="grouphd" style="margin-top:22px;">birthdays</div>
          <ul id="birthdays" class="ev-list"></ul>
          <button id="bday-more" class="linkbtn showmore hidden" type="button"></button>
        </div>

        <div id="past-wrap" class="hidden">
          <button id="past-toggle" class="grouphd grouphd-btn" type="button" style="margin-top:22px;"></button>
          <ul id="past" class="ev-list"></ul>
        </div>
      </div>

      <!-- love note (off for now, flip NOTES_ON to bring it back) -->
      <div class="note hidden" id="note">
        <div class="from" id="note-from"></div>
        <div class="mine">
          <input id="note-input" type="text" maxlength="140" placeholder="leave a note..." />
          <button id="note-save" type="button">save</button>
        </div>
        <div class="saved" id="note-saved"></div>
      </div>

      <!-- footer: milestones + actions -->
      <div class="footer">
        <div class="stat-sub" id="stats-sub" style="margin-top:0"></div>
        <div class="acts">
          <a href="#" id="ics-link">add these to your phone calendar</a>
          <a href="/index.html">pflo.org</a>
        </div>
      </div>

      <input type="file" id="photo-input" accept="image/*" class="hidden" />
      <input type="file" id="gallery-input" accept="image/*" multiple class="hidden" />
      <div class="lightbox" id="lightbox">
        <img id="lightbox-img" alt="" />
        <div id="lb-cap" class="lb-cap"></div>
        <button id="lb-prev" class="lb-arrow lb-prev" type="button" title="previous photo">&#8249;</button>
        <button id="lb-next" class="lb-arrow lb-next" type="button" title="next photo">&#8250;</button>
        <button id="lb-remove" class="lb-remove" type="button">remove</button>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  /* =========================================================
     CONFIG
     ========================================================= */
  const SUPABASE_URL = 'https://hqkbqztcsxaafmshbyrb.supabase.co';

  function sha256Hex(str) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function toISO(dateStr, timeStr) {
    const t = timeStr && timeStr.length ? timeStr : '12:00';
    return new Date(dateStr + 'T' + t).toISOString();
  }
  function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function endOfDay(d) { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtDate(iso, allDay) {
    const d = new Date(iso);
    const day = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    if (allDay) return day;
    return day + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function shortDate(t) { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }

  /* occurrence model (ranges + yearly) */
  function nextYearly(iso) {
    const ref = new Date(iso); const m = ref.getUTCMonth(), day = ref.getUTCDate();
    const now = new Date();
    let occ = new Date(now.getFullYear(), m, day, 12, 0, 0, 0);
    if (occ.getTime() < startOfToday()) occ = new Date(now.getFullYear() + 1, m, day, 12, 0, 0, 0);
    return occ;
  }
  function occStart(e) { return e.recurrence === 'yearly' ? nextYearly(e.starts_at).getTime() : new Date(e.starts_at).getTime(); }
  function occEnd(e) {
    if (e.recurrence === 'yearly') return endOfDay(nextYearly(e.starts_at)).getTime();
    if (e.ends_at) return new Date(e.ends_at).getTime();
    if (e.all_day) return endOfDay(new Date(e.starts_at)).getTime();
    return new Date(e.starts_at).getTime();
  }
  function isYearly(e) { return e.recurrence === 'yearly'; }
  function eventWhen(e) {
    if (isYearly(e)) return fmtDate(nextYearly(e.starts_at).toISOString(), true) + ' · every year';
    let s = fmtDate(e.starts_at, e.all_day);
    if (e.ends_at) s += ' to ' + fmtDate(e.ends_at, e.all_day);
    if (e.created_by && e.created_by !== 'seed') s += '  ·  added by ' + e.created_by;
    return s;
  }

  /* timezone + geo helpers */
  function hourIn(tz) {
    return Number(new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', hour12: false }).format(new Date())) % 24;
  }
  function timeIn(tz) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit' }).format(new Date());
  }
  function awake(name) {
    const w = WAKING[name] || { start: 7, end: 23 };
    const h = hourIn(placeFor(name).tz);
    return h >= w.start && h < w.end;
  }
  function haversineKm(a, b) {
    const R = 6371, toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR, dLon = (b.lon - a.lon) * toR;
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function myTimeZone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch (e) { return null; }
  }
  /* resolve where someone is: their detected timezone if we have it, else the default */
  function placeFor(name) {
    const tz = (PRESENCE[name] && PRESENCE[name].tz) || (PLACES[name] && PLACES[name].tz) || 'UTC';
    const geo = CITIES[tz];
    if (geo) return { city: geo.city, tz: tz, lat: geo.lat, lon: geo.lon };
    const label = tz.indexOf('/') > -1 ? tz.split('/').pop().replace(/_/g, ' ') : tz;
    return { city: label, tz: tz, lat: null, lon: null };
  }

  /* ---- photos (private Supabase Storage bucket "photos") ---- */
  function resizeImage(file, maxDim) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cv.toBlob(function (b) { b ? resolve(b) : reject(new Error('encode failed')); }, 'image/jpeg', 0.85);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = function () { reject(new Error('could not read image')); };
      img.src = URL.createObjectURL(file);
    });
  }
  function uploadPhoto(eventId, file) {
    return resizeImage(file, 1600).then(function (blob) {
      const path = eventId + '.jpg';
      return sb.storage.from('photos').upload(path, blob, { upsert: true, contentType: 'image/jpeg' })
        .then(function (res) {
          if (res.error) throw res.error;
          return sb.from('events').update({ photo_path: path }).eq('id', eventId)
            .then(function (r) { if (r.error) throw r.error; return path; });
        });
    });
  }
  function maybeSignPhotos() {
    const set = {};
    EVENTS.forEach(function (e) { if (e.photo_path) set[e.photo_path] = 1; });
    MEMORIES.forEach(function (m) { if (m.path) set[m.path] = 1; });
    const paths = Object.keys(set);
    if (!paths.length) { PHOTO_URLS = {}; return Promise.resolve(); }
    const need = paths.some(function (p) { return !PHOTO_URLS[p]; }) || (Date.now() - lastSignAt > 3000000);
    if (!need) return Promise.resolve();
    return sb.storage.from('photos').createSignedUrls(paths, 3600).then(function (res) {
      if (res.error) throw res.error;
      const next = {};
      (res.data || []).forEach(function (d) { if (d.signedUrl) next[d.path] = d.signedUrl; });
      PHOTO_URLS = next; lastSignAt = Date.now();
    }).catch(function (err) { console.warn('photo signing failed (bucket set up?)', err && err.message); });
  }

  /* ---- reunion / hero ---- */
  function reunionState() {
    const now = Date.now();
    let ongoing = null, upcoming = null;
    EVENTS.forEach(function (e) {
      if (!e.is_reunion) return;
      const s = occStart(e), en = occEnd(e);
      if (s <= now && now <= en) { if (!ongoing || en < occEnd(ongoing)) ongoing = e; }
      else if (s > now) { if (!upcoming || s < occStart(upcoming)) upcoming = e; }
    });
    /* keep counting down to the real meeting moment even if the calendar
       event has technically started */
    const meet = MEET_AT ? new Date(MEET_AT).getTime() : 0;
    const next = ongoing || upcoming;
    if (meet && now < meet && next && occStart(next) <= meet && meet <= occEnd(next)) {
      return { mode: 'countdown', event: next, target: meet };
    }
    if (ongoing) return { mode: 'together', event: ongoing };
    if (upcoming) return { mode: 'countdown', event: upcoming, target: occStart(upcoming) };
    return { mode: 'none' };
  }
  let heroState = { mode: 'none' };
  let heartsOn = false;

  function renderAll() { renderHero(); renderLists(); }

  function renderHero() {
    heroState = reunionState();
    const hero = $('hero');
    const togetherEl = hero.querySelector('.together');

    if (heroState.mode === 'none') {
      hero.classList.add('empty'); stopHearts();
      if (togetherEl) togetherEl.remove();
      $('hero-cap').textContent = 'until we are together again';
      $('hero-ev').className = 'ev muted';
      $('hero-ev').innerHTML = EVENTS.some(function (e) { return e.is_reunion; })
        ? 'No upcoming reunion marked. Tick the heart when you add the next one.'
        : 'Add the next time you will see each other and tick the heart.';
      return;
    }
    hero.classList.remove('empty');
    const e = heroState.event;
    if (heroState.mode === 'together') {
      $('clock').classList.add('hidden');
      $('hero-cap').textContent = 'right now';
      let tg = togetherEl;
      if (!tg) { tg = document.createElement('div'); tg.className = 'together'; hero.insertBefore(tg, $('hero-ev')); }
      tg.innerHTML = 'we are together &#10084;&#65039;';
      $('hero-ev').className = 'ev';
      $('hero-ev').innerHTML = '<b>' + escapeHtml(e.title) + '</b>'
        + (e.ends_at ? '<br><span class="muted small">until ' + fmtDate(e.ends_at, e.all_day) + '</span>' : '');
      startHearts();
      return;
    }
    if (togetherEl) togetherEl.remove();
    stopHearts();
    $('clock').classList.remove('hidden');
    $('hero-cap').textContent = 'until we are together again';
    $('hero-ev').className = 'ev';
    $('hero-ev').innerHTML = '<b>' + escapeHtml(e.title) + '</b><br><span class="muted small">' + eventWhen(e) + '</span>';
    tickClock();
  }

  function tickClock() {
    if (heroState.mode !== 'countdown') return;
    let ms = heroState.target - Date.now();
    if (ms <= 0) { renderHero(); return; }
    const s = Math.floor(ms / 1000);
    $('c-days').textContent = Math.floor(s / 86400);
    $('c-hrs').textContent = pad(Math.floor((s % 86400) / 3600));
    $('c-min').textContent = pad(Math.floor((s % 3600) / 60));
  }

  function spawnHeart() {

  /* ---- lists ---- */
  function renderLists() {
    const today = startOfToday(), now = Date.now();
    const upcoming = [], birthdays = [], past = [];
    EVENTS.forEach(function (e) {
      if (isYearly(e)) birthdays.push(e);
      else if (occEnd(e) >= today) upcoming.push(e);
      else past.push(e);
    });
    upcoming.sort(function (a, b) { return occStart(a) - occStart(b); });
    birthdays.sort(function (a, b) { return occStart(a) - occStart(b); });
    past.sort(function (a, b) { return occStart(b) - occStart(a); });

    const upEl = $('upcoming'); upEl.innerHTML = '';
    upcoming.forEach(function (e) { appendRow(upEl, e, false, now); });
    $('up-empty').classList.toggle('hidden', upcoming.length > 0);

    const bEl = $('birthdays'); bEl.innerHTML = '';
    (showAllBdays ? birthdays : birthdays.slice(0, 3)).forEach(function (e) { appendRow(bEl, e, false, now); });
    const bMore = $('bday-more');
    bMore.classList.toggle('hidden', birthdays.length <= 3);
    bMore.textContent = showAllBdays ? 'show fewer' : 'show all ' + birthdays.length;
    $('bday-wrap').classList.toggle('hidden', birthdays.length === 0);

    const pEl = $('past'); pEl.innerHTML = '';
    if (showPast) past.forEach(function (e) { appendRow(pEl, e, true, now); });
    $('past-toggle').textContent = 'already happened (' + past.length + ') ' + (showPast ? '▾' : '▸');
    $('past-wrap').classList.toggle('hidden', past.length === 0);
  }
  function appendRow(ul, e, isPast, now) {
    ul.appendChild(row(e, isPast, now));
    if (!openFlights[e.id]) return;
    const fls = flightsFor(e);
    if (!fls.length) return;
    const li = document.createElement('li');
    li.className = 'fl-detail';
    li.innerHTML = fls.map(function (f) { return flightCard(f, now); }).join('');
    ul.appendChild(li);
  }
  function row(e, isPast, now) {
    const ongoing = !isYearly(e) && occStart(e) <= now && now <= occEnd(e);
    const li = document.createElement('li');
    li.className = 'ev-row' + (isPast ? ' past' : '') + (ongoing ? ' now' : '');
    const date = document.createElement('div'); date.className = 'date'; date.textContent = shortDate(occStart(e));
    const body = document.createElement('div'); body.className = 'body';
    const title = document.createElement('div'); title.className = 'title';
    const icon = (e.is_reunion ? '❤️ ' : '') + (isYearly(e) ? '🎂 ' : '');
    title.innerHTML = icon + escapeHtml(e.title) + (ongoing ? ' <span class="nowtag">· on now</span>' : '');
    const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = eventWhen(e);
    body.appendChild(title); body.appendChild(meta);
    li.appendChild(date); li.appendChild(body);

    const url = e.photo_path ? PHOTO_URLS[e.photo_path] : null;
    if (url) {
      const thumb = document.createElement('img');
      thumb.className = 'thumb'; thumb.src = url; thumb.alt = e.title;
      thumb.addEventListener('click', function () { openLightbox({ url: url, type: 'event', id: e.id, path: e.photo_path }); });
      li.appendChild(thumb);
    }
    const fls = flightsFor(e);
    if (fls.length) {
      const fbtn = document.createElement('button');
      fbtn.className = 'photo-btn'; fbtn.type = 'button';
      fbtn.textContent = '✈️';
      fbtn.title = openFlights[e.id] ? 'hide flight details' : 'flight details';
      if (fls.some(function (f) { return now >= new Date(f.dep).getTime() && now <= new Date(f.arr).getTime(); })) {
        fbtn.classList.add('on-air');
      }
      fbtn.addEventListener('click', function () { openFlights[e.id] = !openFlights[e.id]; renderLists(); });
      li.appendChild(fbtn);
    }

    const pbtn = document.createElement('button');
    pbtn.className = 'photo-btn'; pbtn.type = 'button';
    pbtn.textContent = '📷'; pbtn.title = url ? 'change photo' : 'add a photo';
    pbtn.addEventListener('click', function () { onPhotoBtn(e.id); });
    li.appendChild(pbtn);

    const del = document.createElement('button'); del.className = 'del'; del.type = 'button';
    del.innerHTML = '&times;'; del.title = 'remove';
    del.addEventListener('click', function () { onDelete(e.id, e.title); });
    li.appendChild(del);
    return li;
  }

  /* ---- photo button + lightbox + memories slideshow ---- */
  function onPhotoBtn(eventId) {
    pendingPhotoEvent = eventId;
    const inp = $('photo-input'); inp.value = ''; inp.click();
  }
  function onPhotoPicked() {
    const inp = $('photo-input');
    const file = inp.files && inp.files[0];
    if (!file || !pendingPhotoEvent) return;
    const id = pendingPhotoEvent; pendingPhotoEvent = null;
    uploadPhoto(id, file).then(function (path) {
      const ev = EVENTS.filter(function (e) { return e.id === id; })[0];
      if (ev) ev.photo_path = path;
      return maybeSignPhotos();
    }).then(function () { renderAll(); renderMemories(); })
      .catch(function (err) {
        console.error('photo upload failed', err);
        alert('Could not save that photo. Make sure the photos bucket is set up.');
      });
  }
  function openLightbox(item) {
    lightboxIdx = memList.findIndex(function (m) { return m.type === item.type && m.id === item.id; });
    if (lightboxIdx !== -1) item = memList[lightboxIdx]; // pick up the caption when we know it
    currentLightbox = item;
    $('lightbox-img').src = item.url;
    $('lb-cap').textContent = item.caption || '';
    $('lb-remove').style.display = 'block';
    const canStep = lightboxIdx !== -1 && memList.length > 1;
    $('lb-prev').style.display = canStep ? 'block' : 'none';
    $('lb-next').style.display = canStep ? 'block' : 'none';
    $('lightbox').classList.add('on');
  }
  function stepLightbox(dir) {
    if (lightboxIdx === -1 || memList.length < 2) return;
    lightboxIdx = (lightboxIdx + dir + memList.length) % memList.length;
    const m = memList[lightboxIdx];
    currentLightbox = m;
    $('lightbox-img').src = m.url;
    $('lb-cap').textContent = m.caption || '';
  }
  function closeLightbox() { $('lightbox').classList.remove('on'); $('lightbox-img').src = ''; $('lb-cap').textContent = ''; currentLightbox = null; lightboxIdx = -1; }
  function onLightboxRemove() {
    const it = currentLightbox; if (!it) return;
    if (!confirm('Remove this photo?')) return;
    let p;
    if (it.type === 'memory') p = deleteMemory(it.id, it.path);
    else p = sb.from('events').update({ photo_path: null }).eq('id', it.id)
      .then(function (r) { if (r.error) throw r.error; return sb.storage.from('photos').remove([it.path]); });
    p.then(function () { closeLightbox(); refresh(); })
      .catch(function (err) { console.error('remove failed', err); alert('Could not remove that photo.'); });
  }

  function monthYear(t) { return new Date(t).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); }

  /* combine event photos + gallery memories into one slideshow */
  function memoryItems() {
    const out = [];
    EVENTS.forEach(function (e) {
      if (e.photo_path && PHOTO_URLS[e.photo_path]) {
        out.push({ key: 'e:' + e.id + ':' + PHOTO_URLS[e.photo_path], url: PHOTO_URLS[e.photo_path], caption: e.title + ' · ' + monthYear(occStart(e)), sort: occStart(e), type: 'event', id: e.id, path: e.photo_path });
      }
    });
    MEMORIES.forEach(function (m) {
      if (PHOTO_URLS[m.path]) {
        const t = m.taken_on ? new Date(m.taken_on + 'T00:00:00').getTime() : (m.created_at ? new Date(m.created_at).getTime() : Date.now());
        out.push({ key: 'm:' + m.id + ':' + PHOTO_URLS[m.path], url: PHOTO_URLS[m.path], caption: m.caption || monthYear(t), sort: t, type: 'memory', id: m.id, path: m.path });
      }
    });
    out.sort(function (a, b) { return b.sort - a.sort; });
    return out;
  }
  function renderMemories() {
    const wrap = $('memories'), frame = $('mem-frame'), cap = $('mem-cap');
    wrap.style.display = 'block'; // keep the "+ add photos" link visible
    memList = memoryItems();
    if (!memList.length) {
      frame.style.display = 'none'; cap.style.display = 'none';
      if (memTimer) { clearInterval(memTimer); memTimer = null; }
      frame.innerHTML = ''; lastMemKey = ''; renderAlbum(); return;
    }
    frame.style.display = 'block'; cap.style.display = 'block';
    const key = memList.map(function (m) { return m.key; }).join('|');
    if (key === lastMemKey) return; // unchanged, let rotation continue
    lastMemKey = key;
    frame.innerHTML = '';
    memList.forEach(function (m, i) {
      const slide = document.createElement('div');
      slide.className = 'mem-slide' + (i === 0 ? ' on' : '');
      const bg = document.createElement('div');
      bg.className = 'mem-bg';
      bg.style.backgroundImage = 'url("' + m.url + '")';
      const img = document.createElement('img');
      img.src = m.url; img.alt = m.caption;
      img.addEventListener('click', function () { openLightbox(m); });
      slide.appendChild(bg); slide.appendChild(img);
      frame.appendChild(slide);
    });
    if (memList.length > 1) {
      const prev = document.createElement('button');
      prev.className = 'mem-arrow mem-prev'; prev.type = 'button'; prev.title = 'previous photo';
      prev.innerHTML = '&#8249;';
      prev.addEventListener('click', function () { manualMem(-1); });
      const next = document.createElement('button');
      next.className = 'mem-arrow mem-next'; next.type = 'button'; next.title = 'next photo';
      next.innerHTML = '&#8250;';
      next.addEventListener('click', function () { manualMem(1); });
      frame.appendChild(prev); frame.appendChild(next);
    }
    memIdx = 0; showMem(0);
    if (memTimer) clearInterval(memTimer);
    if (memList.length > 1) memTimer = setInterval(nextMem, 5000);
    renderAlbum();
  }
  function showMem(i) {
    const slides = $('mem-frame').querySelectorAll('.mem-slide');
    slides.forEach(function (s, j) { s.classList.toggle('on', j === i); });
    $('mem-cap').textContent = memList[i] ? memList[i].caption : '';
  }
  function nextMem() { if (!memList.length) return; memIdx = (memIdx + 1) % memList.length; showMem(memIdx); }
  function manualMem(dir) {
    if (!memList.length) return;
    memIdx = (memIdx + dir + memList.length) % memList.length;
    showMem(memIdx);
    if (memTimer) { clearInterval(memTimer); memTimer = setInterval(nextMem, 5000); } // restart the auto-advance clock
  }

  /* iPhone-style photo grid under the slideshow */
  function renderAlbum() {
    const el = $('album');
    el.classList.toggle('hidden', !albumOpen);
    $('album-toggle').textContent = albumOpen ? 'hide album' : 'browse album';
    el.innerHTML = '';
    if (!albumOpen) return;
    memList.forEach(function (m) {
      const img = document.createElement('img');
      img.src = m.url; img.alt = m.caption; img.loading = 'lazy';
      img.addEventListener('click', function () { openLightbox(m); });
      el.appendChild(img);
    });
  }

  /* batch upload to the gallery */
  function onGalleryPicked() {
    const inp = $('gallery-input');
    const files = Array.prototype.slice.call(inp.files || []);
    if (!files.length) return;
    const link = $('add-photos-link');
    let done = 0;
    link.textContent = 'uploading 0/' + files.length + '…';
    files.reduce(function (chain, f) {
      return chain.then(function () {
        return uploadGalleryPhoto(f).catch(function (err) { console.error('one photo failed', err); });
      }).then(function () { done++; link.textContent = 'uploading ' + done + '/' + files.length + '…'; });
    }, Promise.resolve()).then(function () {
      inp.value = '';
      link.textContent = '+ add photos';
      refresh();
    }).catch(function (err) {
      console.error('gallery upload failed', err);
      link.textContent = '+ add photos';
      alert('Some photos could not be uploaded. Is the photos bucket set up?');
    });
  }

  /* ---- status strip: clocks + call window + distance ---- */
  function renderStatus() {
    const me = placeFor(MY_NAME), you = placeFor(partnerName());
    if (!me.tz || !you.tz) return;
    const sameTz = me.tz === you.tz;
    const together = reunionState().mode === 'together';   // a reunion event happening now = actually together

    // clocks (your city first, then theirs)
    $('clocks').innerHTML =
      '<span class="c">' + escapeHtml(me.city) + ' <b>' + timeIn(me.tz) + '</b></span>'
      + '<span class="sep">·</span>'
      + '<span class="c">' + escapeHtml(you.city) + ' <b>' + timeIn(you.tz) + '</b></span>';

    const cw = $('callwin'), dist = $('dist');

    // "together" comes only from your reunion (heart) events, not from matching timezones
    if (together) {
      cw.textContent = ''; cw.className = 'callwin';
      dist.className = 'dist together';
      dist.innerHTML = 'together right now ❤️';
      return;
    }
    // same timezone but no reunion on now: just say so, do not claim you are together
    if (sameTz) {
      cw.textContent = 'you are in the same timezone';
      cw.className = 'callwin good';
      dist.className = 'dist';
      dist.innerHTML = '';
      return;
    }
    // apart, in different timezones
    if (awake(MY_NAME) && awake(partnerName())) { cw.textContent = 'you are both awake, good time to call ☎️'; cw.className = 'callwin good'; }
    else { const asleep = !awake(partnerName()) ? you.city : me.city; cw.textContent = asleep + ' is probably asleep 🌙'; cw.className = 'callwin'; }
    let inner = '<span class="city">' + escapeHtml(me.city) + '</span>'
      + '<span class="line"><span class="plane">✈️</span></span>'
      + '<span class="city">' + escapeHtml(you.city) + '</span>';
    if (me.lat != null && you.lat != null) {
      const km = Math.round(haversineKm(me, you) / 10) * 10;
      inner += '<span class="km" style="margin-left:4px">' + km.toLocaleString() + ' km</span>';
    }
    dist.className = 'dist';
    dist.innerHTML = inner;
  }

  /* ---- flight tracker ---- */
  function fmtAirportTime(iso, tz) {
    return new Intl.DateTimeFormat(undefined, {
      timeZone: tz, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    }).format(new Date(iso));
  }
  function durShort(ms) {
    const m = Math.max(0, Math.floor(ms / 60000));
    const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
    if (d) return d + 'd ' + h + 'h';
    if (h) return h + 'h ' + pad(mm) + 'm';
    return mm + 'm';
  }
  function flightCard(f, now) {
    const dep = new Date(f.dep).getTime(), arr = new Date(f.arr).getTime();
    let pct = 0, cls = '', status = '';
    if (now < dep) { status = 'departs in ' + durShort(dep - now); }
    else if (now <= arr) {
      pct = (now - dep) / (arr - dep); cls = ' inair';
      status = 'in the air · ' + Math.round(pct * 100) + '% of the way · lands in ' + durShort(arr - now);
    } else { pct = 1; cls = ' landed'; status = 'landed 🛬'; }
    const link = 'https://www.flightaware.com/live/flight/' + encodeURIComponent((f.track || f.flight).replace(/\s+/g, ''));
    return '<div class="flight' + cls + '">'
      + '<div class="fl-top"><span class="fl-who">✈️ ' + escapeHtml(f.who) + ' flies to ' + escapeHtml(f.dest.city) + '</span>'
      + '<span class="fl-no">' + escapeHtml(f.flight) + (f.operator ? ' · ' + escapeHtml(f.operator) : '') + '</span></div>'
      + '<div class="fl-bar"><span class="fl-plane" style="left:' + (2 + pct * 96) + '%">✈️</span></div>'
      + '<div class="fl-codes"><span><b>' + escapeHtml(f.from.code) + '</b> ' + escapeHtml(f.from.city) + '</span>'
      + (f.via ? '<span>via ' + escapeHtml(f.via) + '</span>' : '')
      + '<span>' + escapeHtml(f.dest.city) + ' <b>' + escapeHtml(f.dest.code) + '</b></span></div>'
      + '<div class="fl-times">departs ' + fmtAirportTime(f.dep, f.from.tz) + ' · lands ' + fmtAirportTime(f.arr, f.dest.tz) + ' · local times</div>'
      + '<div class="fl-status">' + status + ' · <a href="' + link + '" target="_blank" rel="noopener">follow live</a></div>'
      + '</div>';
  }
  /* flights whose departure falls in (or within a day and a half of) an event's dates */
  function flightsFor(e) {
    if (isYearly(e)) return [];
    const buf = 129600000; // 1.5 days
    const s = occStart(e) - buf, en = occEnd(e) + buf;
    return FLIGHTS.filter(function (f) {
      const d = new Date(f.dep).getTime();
      return d >= s && d <= en;
    }).sort(function (a, b) { return new Date(a.dep) - new Date(b.dep); });
  }

  /* ---- love note ---- */
  function renderNote() {
    if (!notesAvailable) { $('note').classList.add('hidden'); return; }
    $('note').classList.remove('hidden');
    const theirs = NOTES[partnerName()];
    const from = $('note-from');
    if (theirs && theirs.body) {
      from.innerHTML = '<b>' + escapeHtml(partnerName()) + ':</b> ' + escapeHtml(theirs.body);
    } else {
      from.innerHTML = '<span class="empty">no note from ' + escapeHtml(partnerName()) + ' yet</span>';
    }
    const mine = NOTES[MY_NAME];
    if (mine && mine.body && document.activeElement !== $('note-input') && !$('note-input').value) {
      $('note-input').value = mine.body;
    }
  }

  /* ---- days together ---- */
  function daysSince(dateStr) {
    const p = dateStr.split('-').map(Number);
    const then = Date.UTC(p[0], p[1] - 1, p[2]);
    const n = new Date();
    const today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((today - then) / 86400000);
  }
  function prettyDate(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function renderStats() {
    const together = daysSince(MILESTONES.couple);
    $('stats-head').innerHTML = '<span class="big">' + together.toLocaleString() + ' days</span> together ❤️';
    $('stats-sub').innerHTML = 'met ' + prettyDate(MILESTONES.met)
      + ' · first trip to Paris ' + prettyDate(MILESTONES.paris)
      + ' · together since ' + prettyDate(MILESTONES.couple);
  }

  /* ---- per-second tick ---- */
  let lastClockMin = '';
  function tick() {
    tickClock();
    const stamp = timeIn(placeFor(MY_NAME).tz) + timeIn(placeFor(partnerName()).tz);
    if (stamp !== lastClockMin) { lastClockMin = stamp; renderStatus(); renderLists(); }
  }

  /* ---- .ics export ---- */
  function icsDate(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function icsDateUTC(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate())
      + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }
  function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  function downloadICS() {
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//oss//calendar//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:oss'];
    EVENTS.forEach(function (e) {
      L.push('BEGIN:VEVENT');
      L.push('UID:' + e.id + '@pflo.org');
      L.push('SUMMARY:' + icsEsc((e.is_reunion ? '❤️ ' : '') + (isYearly(e) ? '🎂 ' : '') + e.title));
      if (isYearly(e)) {
        const ref = new Date(e.starts_at);
        const occ = new Date(new Date().getFullYear(), ref.getUTCMonth(), ref.getUTCDate());
        L.push('DTSTART;VALUE=DATE:' + icsDate(occ));
        L.push('RRULE:FREQ=YEARLY');
      } else if (e.all_day) {
        const s = new Date(e.starts_at);
        L.push('DTSTART;VALUE=DATE:' + icsDate(s));
        const end = e.ends_at ? new Date(e.ends_at) : new Date(e.starts_at);
        const endPlus = new Date(end); endPlus.setDate(endPlus.getDate() + 1);
        L.push('DTEND;VALUE=DATE:' + icsDate(endPlus));
      } else {
        L.push('DTSTART:' + icsDateUTC(new Date(e.starts_at)));
        L.push('DTEND:' + icsDateUTC(new Date(e.ends_at || e.starts_at)));
      }
      L.push('END:VEVENT');
    });
    L.push('END:VCALENDAR');
    const blob = new Blob([L.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'us.ics';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /* =========================================================
     boot
     ========================================================= */
  $('login-form').addEventListener('submit', handleLogin);
  if (sb) {
    sb.auth.getSession().then(function (res) {
      const session = res && res.data && res.data.session;
      if (session && session.user) showApp(EMAIL_NAME[session.user.email] || 'you');
      else $('pw').focus();
    });
  } else {
    $('login-err').textContent = 'could not reach the server, check your connection';
  }
  </script>
</body>

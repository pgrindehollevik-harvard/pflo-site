<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noise → Image Scrubber</title>
  <meta name="description" content="An interactive scrubber that animates the transition between noise and a clean image." />
  <link rel="canonical" href="https://pflo.org/demos/noise-scrubber/" />
  <style>
    body { margin: 24px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .stage { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; background:#111;
             border-radius:12px; overflow:hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    .controls { display:flex; gap:8px; align-items:center; margin-top:12px; max-width:960px; }
    input[type="range"] { flex:1; }
    .btn { padding:6px 10px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; }
    .pill { font-size:12px; color:#fff; background:rgba(0,0,0,.45); padding:4px 6px; border-radius:6px; }
    .toolbar { position:absolute; left:12px; right:12px; bottom:12px; display:flex; gap:8px; align-items:center; }
    .row { display:flex; gap:8px; align-items:center; margin-top:8px; max-width:960px; }
    .input { flex:1; padding:6px 8px; border:1px solid #ccc; border-radius:6px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Noise → Image Scrubber</h1>
  <p>Drag the slider to move from pure noise to the original image. Visual analogy to reverse diffusion. All client-side.</p>

  <div class="stage">
    <canvas id="c"></canvas>
    <div class="toolbar">
      <input id="r" type="range" min="0" max="1000" value="0" />
      <button id="play" class="btn">Play</button>
      <span id="tlabel" class="pill">t = 0.00</span>
    </div>
  </div>

  <div class="row">
    <label for="src">Image:</label>
    <input id="src" class="input" value="../../cover.jpg" />
    <button id="load" class="btn">Load</button>
  </div>

  <script src="./script.js"></script>
</body>
</html>
